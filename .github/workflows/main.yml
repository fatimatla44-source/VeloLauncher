name: Build VeloLauncher APK

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply VeloLauncher Icon
        run: |
          rm -rf Hyper_Launcher_v3/src/main/res/mipmap-anydpi-v26
          for dir in Hyper_Launcher_v3/src/main/res/mipmap-*; do
            rm -f "$dir"/*.webp
            cp ic_launcher.png "$dir/ic_launcher.png"
            cp ic_launcher.png "$dir/ic_launcher_round.png"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VeloLauncher-APK
          path: "**/full/debug/*.apk"
          
